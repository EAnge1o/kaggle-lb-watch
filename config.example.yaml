# lbwatch 配置 —— 复制为 config.yaml 后修改
# teams: 你的队伍名（Public LB 上的 TeamName，大小写不敏感；精确匹配优先，含子串兜底）
teams:
  - "你的队伍名"

# competitions: 要盯的比赛。slug 是 kaggle.com/competitions/ 后面那串。
competitions:
  - slug: santander-customer-transaction-prediction
    name: Santander 交易预测          # 可选，缺省用 slug
  # - slug: another-competition-slug
  #   name: 另一场比赛

fetch:
  discover: active    # 自动发现「我加入的比赛」: off=只盯下面 competitions / active=只盯未截止的 / all=含已结束
  exclude: []         # 自动发现时不想盯的比赛 slug 黑名单
  history_top: 2000   # history.csv 常驻队伍数上限（你的队伍不受此限制，永远保留）
  keep_snapshots: 0   # 0 = 永久保留逐日全量快照；>0 = 只保留最近 N 天
