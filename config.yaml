# lbwatch 运行配置
# 谁盯：个人参赛，Public LB 上的 TeamName = Kaggle 用户名
teams:
  - "flagg111"

# 盯什么：还没定比赛，先留空（工作流会优雅跳过）
# 定了后按下面格式加：
competitions: []
#  - slug: playground-series-s5e1        # kaggle.com/competitions/ 后面那串
#    name: Playground S5E1

fetch:
  history_top: 2000   # history.csv 常驻队伍数上限（你的队伍不受此限制，永远保留）
  keep_snapshots: 0   # 0 = 永久保留逐日全量快照；>0 = 只保留最近 N 天
