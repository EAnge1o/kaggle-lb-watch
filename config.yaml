# lbwatch 运行配置
# 谁盯：个人参赛，Public LB 上的 TeamName = Kaggle 用户名
teams:
  - "flagg111"

# 盯什么
competitions:
  - slug: enveda-CASMI26-molecule-id-mass-spectra
    name: Enveda CASMI26

fetch:
  history_top: 2000   # history.csv 常驻队伍数上限（你的队伍不受此限制，永远保留）
  keep_snapshots: 0   # 0 = 永久保留逐日全量快照；>0 = 只保留最近 N 天
